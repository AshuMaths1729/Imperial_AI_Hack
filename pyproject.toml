[project]
name = "scholartwin-backend"
version = "0.2.0"
description = "Athena API: PDF/graph pipeline, Paper2Sim, platform services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.11",
    "anthropic",
    "anyio>=4",
    "livekit-api>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real external APIs (needs keys); deselect with -m 'not live'",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "cache", "state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the idiom
    "ASYNC109",  # `timeout` parameter is part of the broker call signature
]

[tool.ruff.lint.per-file-ignores]
# prototype code moved as-is; removed together with the module
"app/modules/legacy/*" = ["E501"]
