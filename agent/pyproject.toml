[project]
name = "scholartwin-tutor-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[anthropic,elevenlabs,silero]~=1.8",
    "livekit-plugins-synthesia~=1.8",
    "python-dotenv",
    "httpx",
    "jsonschema>=4",
    "fal-client>=1.0",
    "anthropic>=1.17.0",
    "livekit-plugins-noise-cancellation>=0.3.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
